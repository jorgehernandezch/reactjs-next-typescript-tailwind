version: '3.8'
services:
  react-next-15:
    image: node:20-alpine
    container_name: react-next-15
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    working_dir: /app
    stdin_open: true
    tty: true